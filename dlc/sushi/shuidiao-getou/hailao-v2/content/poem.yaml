schemaVersion: 1
title: 水调歌头·明月几时有
lines:
  - id: L1
    original: 明月几时有？把酒问青天。
    translation: 明月是从什么时候开始有的呢？我端起酒杯问一问苍天。
    note: 开篇破空而来，屈原《天问》有「九天之际，安放安属」之问，李白有「青天有月来几时？我今停杯一问之」。苏轼此问，既有谪仙之风，又有哲思之深。
    glosses:
      - word: 把酒
        meaning: 端着酒杯。把，持、握。
    study:
      - id: s1-mood
        title: 创作心境·为什么偏偏是这一晚？
        category: mood
        body: |
          熙宁九年（1076）中秋，苏轼在密州任知州。此时他四十一岁，外放地方已是第五个年头。
          七年前他与弟弟苏辙在颍川分手后，就再也没见过面。中秋本是团圆的日子，他却孤身一人。
          但这首词并不只是"想弟弟"那么简单——它是苏轼一生的缩影：想兼济天下，又想逍遥物外；
          想回到朝廷，又怕党争漩涡；想与弟弟团聚，又身不由己。所有这些矛盾，都在这一晚的酒意里，
          化作了一句"明月几时有"。
  - id: L2
    original: 不知天上宫阙，今夕是何年。
    translation: 不知道天上的宫殿，今夜是哪一年呢？
    note: 把对月亮的想象具体化——天上也有宫殿，也有年月，只是与人世不同。这是「乘风归去」的铺垫。
    glosses:
      - word: 宫阙
        meaning: 宫殿。阙，皇宫门前两边的楼台。
    study:
      - id: s2-compare
        title: 同题对比·古人如何写"月中有什么"？
        category: compare
        body: |
          古人想象月亮上有什么？最著名的答案是"广寒宫"——一座建在月亮上的宫殿，住着嫦娥，养着玉兔，
          还有一个永远砍不倒桂树的吴刚。
          李白写"小时不识月，呼作白玉盘"，是孩子眼里的月亮；
          张九龄写"海上生明月，天涯共此时"，是情人眼里的月亮；
          苏轼写"天上宫阙""今夕何年"，是谪仙眼里的月亮——
          他不只想月亮美不美，还想月亮上有没有人、过着怎样的日子。
  - id: L3
    original: 我欲乘风归去，又恐琼楼玉宇，高处不胜寒。
    translation: 我想乘着风回到天上，又怕那美玉砌成的楼宇，太高了，受不住那里的寒冷。
    note: 「归去」二字极妙——苏轼自认是天上贬下来的仙人，所以回天上去是「归」，不是「去」。但仙人也怕冷，也有凡人的犹豫。
    glosses:
      - word: 琼楼玉宇
        meaning: 美玉砌成的楼宇，指月中宫殿。琼、玉，都是美玉。宇，屋檐，代指房屋。
      - word: 不胜寒
        meaning: 受不住寒冷。胜，承受得住。
    study:
      - id: s3-influence
        title: 后世影响·为什么"高处不胜寒"成了一句俗语？
        category: influence
        body: |
          "高处不胜寒"现在常用来比喻地位越高、越孤独。但苏轼写这句话的时候，有三重意思：
          第一层，字面上，天上太冷了；
          第二层，比喻朝廷里的党争和倾轧，站得越高越危险；
          第三层，哲学意义上，越接近真理的人，越孤独。
          南宋胡仔评价这首词："中秋词，自东坡《水调歌头》一出，余词尽废。"意思是说，
          有了苏轼这首词，别的中秋词都可以不用读了。虽然有点夸张，但足以说明它的地位。
  - id: L4
    original: 起舞弄清影，何似在人间。
    translation: 起身跳舞，与自己清朗的影子相伴——哪里比得上在人间呢？
    note: 这是上阕的「转身」。想上天去，可又觉得还是人间好。这就是苏轼的可爱之处——再出世的人，也留恋人间的温度。
    glosses:
      - word: 弄清影
        meaning: 和清朗的影子嬉戏。弄，戏弄、嬉戏。
  - id: L5
    original: 转朱阁，低绮户，照无眠。
    translation: 月光转过朱红色的楼阁，低低地照进雕花的窗户，照着那个睡不着的人。
    note: 这句没有主语，但处处是月亮——月亮在动，人无眠。月光是无辜的，可睡不着的人总觉得月光是故意来照自己的。
    glosses:
      - word: 朱阁
        meaning: 朱红色的楼阁。
      - word: 绮户
        meaning: 雕花的窗户。绮，有花纹的丝织品。
  - id: L6
    original: 不应有恨，何事长向别时圆？
    translation: （月亮）你不应该对人有什么怨恨吧，为什么偏偏在人们分离的时候才圆呢？
    note: 这是「怨月」——月亮本来只是自然现象，但睡不着的人偏要怪它。这种「不讲理」的写法，最见情深。
    glosses:
      - word: 何事
        meaning: 为什么。
    study:
      - id: s6-person
        title: 苏辙其人·苏轼为什么总想起这个弟弟？
        category: person
        body: |
          苏辙，字子由，苏轼的弟弟，比苏轼小三岁。
          他们兄弟俩从小一起读书、一起赶考、一起做官，是兄弟，也是朋友，还是政途上最懂彼此的人。
          苏轼因为"乌台诗案"下狱时，苏辙愿意削去自己的官职来赎哥哥的罪——这是真的手足情深。
          苏轼一生写了无数给子由的诗，最有名的就是这首《水调歌头》，还有"与君世世为兄弟，更结来生未了因"。
          意思是：我和你这辈子做兄弟还不够，下辈子、下下辈子，我们还要做兄弟。
  - id: L7
    original: 人有悲欢离合，月有阴晴圆缺，此事古难全。
    translation: 人有悲欢离合，月有阴晴圆缺，这种事情自古以来就难以周全。
    note: 从怨月，到理解月，再到自我开解——苏轼只用了三句话。这就是他的「旷达」：不是没烦恼，而是烦恼来了，他能自己把它想通。
    glosses:
      - word: 古难全
        meaning: 自古以来就难以周全。全，齐全、圆满。
  - id: L8
    original: 但愿人长久，千里共婵娟。
    translation: 只希望人们都能长久平安，即使相隔千里，也能共享这美好的月光。
    note: 这是整首词的「词眼」。从「问青天」的哲思，到「怨月亮」的情痴，最后落在一句温暖的祝愿上——不是求团圆，而是求「长久」；不是求相见，而是求「共婵娟」。这就是苏轼的温度。
    glosses:
      - word: 婵娟
        meaning: 美好的样子，这里指月亮。也可指美女。
    study:
      - id: s8-influence
        title: 后世影响·这两句为什么成了中秋第一祝福？
        category: influence
        body: |
          "但愿人长久，千里共婵娟"之所以成为中秋词第一名句，是因为它把"离别"写得很温暖。
          大多数写离别的诗词，都是悲伤的——"独在异乡为异客，每逢佳节倍思亲"是孤独，
          "劝君更尽一杯酒，西出阳关无故人"是惆怅。
          但苏轼不一样。他承认离别是苦的，可他说：那又怎样呢？至少我们看的是同一个月亮啊。
          这种"不是圆满，胜似圆满"的境界，让这句词超越了普通的思念，变成了所有中国人在中秋节时，
          心里都会想起的一句话。
