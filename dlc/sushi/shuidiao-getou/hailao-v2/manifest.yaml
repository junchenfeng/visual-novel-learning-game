easterEgg:
  kind: fill-in
  title: 补全苏轼心中那阕词
  params:
    blanks:
      - prefix: "明月几时有，把酒问"
        suffix: "。"
        correct: 青天
        options: [青天, 苍天, 长天, 远天]
      - prefix: "不知天上宫阙，今夕是"
        suffix: "。"
        correct: 何年
        options: [何年, 何夕, 几年, 几时]
      - prefix: "人有悲欢离合，月有阴晴圆缺，此事古"
        suffix: "全。"
        correct: 难
        options: [难, 不, 未, 莫]
endings:
  - endingId: ending_changjiu
    title: 但愿人长久
    subtitle: 千里共婵娟
    triggerHint: 亲情权重最高
    quote: 但愿人长久，千里共婵娟。
  - endingId: ending_gaochu
    title: 高处不胜寒
    subtitle: 起舞弄清影，何似在人间
    triggerHint: 仕途之心最高
    quote: 高处不胜寒。起舞弄清影，何似在人间。
  - endingId: ending_guiqu
    title: 归去，也无风雨也无晴
    subtitle: 早退田园，兄弟相守
    triggerHint: 旷逸指数最高
    quote: 归去，也无风雨也无晴。

