title: 水调歌头·明月几时有
author: 海棠海棠
poet: 苏轼
poetId: sushi
workTitle: 水调歌头
summary: 密州中秋夜，苏轼大醉，想起远方的弟弟苏辙，提笔写下这首千古中秋第一词。这次，你的选择将决定苏轼的人生走向——是仕途兼济，是归隐田园，还是千里共婵娟？
