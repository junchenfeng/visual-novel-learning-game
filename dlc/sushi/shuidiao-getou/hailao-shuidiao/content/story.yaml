schemaVersion: 1
chapters:
  - chapter: 1
    background: assets/backgrounds/chapter-1-brothers.webp
  - chapter: 2
    background: assets/backgrounds/chapter-2-reform-debate.webp
  - chapter: 3
    background: assets/backgrounds/chapter-3-mid-autumn.webp
nodes:
  - id: ch1_open
    type: narration
    chapter: 1
    chapterTitle: 苏轼与苏辙
    text: 你忽然发现自己变成了苏轼。身边最亲的人，是弟弟苏辙。你们从小一起读书、一起写文章，别人常说苏家兄弟像分不开的左右手。
    nextNodeId: ch1_choice
  - id: ch1_choice
    type: choice
    chapter: 1
    chapterTitle: 苏轼与苏辙
    portrait: suzhe
    convergesTo: ch1_join
    text: 今晚月亮很圆。如果你是苏轼，想念弟弟的时候会做什么？
    choices:
      - id: write_letter
        label: 先给弟弟写信，告诉他今晚的月亮
        nextNodeId: ch1_a
        feedback: 信很慢，但你还是想把心里的话写下来。
      - id: remember_childhood
        label: 先回忆小时候一起读书的日子
        nextNodeId: ch1_b
        feedback: 旧时光一下子涌上来，弟弟的声音仿佛还在耳边。
  - id: ch1_a
    type: narration
    chapter: 1
    chapterTitle: 苏轼与苏辙
    text: 你铺开纸，却不知道这封信要走多久。你们不在同一个地方做官，见面比写信难得多。
    nextNodeId: ch1_join
  - id: ch1_b
    type: narration
    chapter: 1
    chapterTitle: 苏轼与苏辙
    text: 你想起小时候，弟弟总爱追着你问字、问诗。后来他的文章也很出色，你们互相鼓励，也互相想念。
    nextNodeId: ch1_join
  - id: ch1_join
    type: narration
    chapter: 1
    chapterTitle: 苏轼与苏辙
    text: 无论先写信还是先回忆，结果都一样：你非常想念苏辙。这种想念，会写进今晚的词里。
    nextNodeId: ch2_open
  - id: ch2_open
    type: narration
    chapter: 2
    chapterTitle: 变法与外放
    text: 京城里正在为一件大事争论。在你决定怎么走之前，先看清这件事到底是什么。
    nextNodeId: ch2_fact_reform
  - id: ch2_fact_reform
    type: fact
    chapter: 2
    chapterTitle: 变法与外放
    heading: 王安石变法是什么
    text: 那时宋朝正在推行「王安石变法」。王安石希望朝廷更有钱、军队更强，于是改税法、改役法，让地方把更多粮食、钱和人力交给中央。支持的人觉得这是在救国家；担心的人觉得改得太急，百姓一下子不适应。
    nextNodeId: ch2_fact_disagree
  - id: ch2_fact_disagree
    type: fact
    chapter: 2
    chapterTitle: 变法与外放
    heading: 苏轼为什么不同意
    text: 苏轼不反对国家变好，但他担心：新法来得太快，执行的人又不一定都好心，地方上可能乱摊派、伤到普通人家。他写文章指出问题，和王安石意见合不来。争论越来越凶，京城对他来说不再是可以安静写字的地方。
    nextNodeId: ch2_choice
  - id: ch2_choice
    type: choice
    chapter: 2
    chapterTitle: 变法与外放
    portrait: sushi
    convergesTo: ch2_join
    text: 面对变法争论，你会怎么走？
    choices:
      - id: ask_transfer
        label: 坚持自己的看法，请求离开京城
        nextNodeId: ch2_a
        feedback: 你把争论放下，把脚步迈向远方。
      - id: serve_local
        label: 到地方做事，用实际行动证明想法
        nextNodeId: ch2_b
        feedback: 你把心思放在地方百姓身上，京城反而更远了。
      - id: stay_and_fight
        label: 留在京城，当面硬碰王安石
        nextNodeId: ch2_over
        feedback: 争论越来越激烈，事情变得更糟。
  - id: ch2_a
    type: narration
    chapter: 2
    chapterTitle: 变法与外放
    text: 你离开京城，辗转好几个地方。官职还在，可和弟弟的距离越来越远。
    nextNodeId: ch2_join
  - id: ch2_b
    type: narration
    chapter: 2
    chapterTitle: 变法与外放
    text: 地方的事务很多。你忙着处理公务，却发现想见苏辙一面，比以前更难。
    nextNodeId: ch2_join
  - id: ch2_over
    type: gameOver
    chapter: 2
    chapterTitle: 变法与外放
    portrait: anshi
    speaker: 旁白
    text: 你留在京城继续争论。政见冲突越来越尖锐，你被贬得更远，也更难见到苏辙。这条路走不通，《水调歌头》不会在今晚写成。请回到刚才的选择，换一条路。
  - id: ch2_join
    type: narration
    chapter: 2
    chapterTitle: 变法与外放
    text: 外放之后，兄弟见面变得更难。这就是《水调歌头》背后的时代背景：政见不同，人在天涯。
    nextNodeId: ch3_open
  - id: ch3_open
    type: narration
    chapter: 3
    chapterTitle: 密州中秋
    text: 熙宁七年（1074），你调到密州。你曾经希望调到离苏辙更近的地方，好常见面。这个愿望没有实现。
    nextNodeId: ch3_choice
  - id: ch3_choice
    type: choice
    chapter: 3
    chapterTitle: 密州中秋
    portrait: moon
    convergesTo: ch3_join
    text: 熙宁九年中秋，皓月当空。你会先做什么？
    choices:
      - id: toast_sky
        label: 举起酒杯，问问天上的月亮
        nextNodeId: ch3_a
        feedback: 酒很凉，月很亮，你把问题抛给青天。
      - id: count_years
        label: 默默数一数，和弟弟分别多少年了
        nextNodeId: ch3_b
        feedback: 你算了又算：分别，已经七年。
  - id: ch3_a
    type: narration
    chapter: 3
    chapterTitle: 密州中秋
    text: 你问月亮：天上的宫殿今晚是哪一年？你想乘风回去，又怕高处太冷。人间虽然有别离，却还有弟弟。
    nextNodeId: ch3_join
  - id: ch3_b
    type: narration
    chapter: 3
    chapterTitle: 密州中秋
    text: 从分别到今晚，已经七年。密州的月光铺满地面，你知道弟弟此刻也在某处望着同一轮月。
    nextNodeId: ch3_join
  - id: ch3_join
    type: narration
    chapter: 3
    chapterTitle: 密州中秋
    text: 七年未见。酒杯里倒映着月亮。你决定把心里的话写成《水调歌头》。下面，请一句一句读它。
