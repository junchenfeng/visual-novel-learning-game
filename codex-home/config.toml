# poem-dlc-ingest 专用轻量 Codex 配置。
# 与 ~/.codex、ai-gallery grading-agent 隔离：无 MCP / plugins / memories。
#
# 用法：
#   export CODEX_HOME="$(pwd)/codex-home"
#   ./scripts/codex-exec.sh '只回复：TokenHub OK'
#
# 模型走腾讯云 TokenHub（与 ai-gallery 同一口径）：DeepSeek 直连口径已下线，
# 密钥取 TOKENHUB_API_KEY 或 ai-gallery config.json 的 llm tokenhub api-key。

model = "deepseek-v4.1-flash"
model_provider = "tokenhub"
model_catalog_json = "model-catalog.tokenhub.json"

# 降低思考预算：实测（2026-10-10）同一份评审提示词，默认 effort 在 TokenHub 上会生成
# ≥20k token 的思维链（102.5s，还被 max_output 截断），effort=low 约 11.3k（72.7s）。
# 线上评审 74–200s 几乎全是 thinkMs，所以这里显式降到 low。
model_reasoning_effort = "low"

approval_policy = "never"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

[model_providers.tokenhub]
name = "Tencent TokenHub"
base_url = "https://tokenhub.tencentmaas.com/v1"
env_key = "TOKENHUB_API_KEY"
wire_api = "responses"
env_key_instructions = "Set TOKENHUB_API_KEY (same value as ai-gallery config.json llm tokenhub api-key)"

[features]
memories = false
js_repl = false
plugins = false
recommended_plugins = false

[projects."/tmp"]
trust_level = "trusted"

[projects."/private/tmp"]
trust_level = "trusted"

[projects."/var/tmp"]
trust_level = "trusted"

[projects."/private/var/folders/8d/n039kw09427b6w3g3nxz0f6m0000gn/T/poem-dlc-ingest-codex-empty"]
trust_level = "trusted"

[projects."/private/var/folders/8d/n039kw09427b6w3g3nxz0f6m0000gn/T/codex-probe-OqumoV/codex-job"]
trust_level = "trusted"

[projects."/private/var/folders/8d/n039kw09427b6w3g3nxz0f6m0000gn/T/codex-probe-PTNP6t/codex-job"]
trust_level = "trusted"
